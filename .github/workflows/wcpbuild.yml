name: WCP Build

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install zstd
        run: sudo apt-get update -y && sudo apt-get install -y zstd

      - name: Get latest build SHA and run ID
        id: get-sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_JSON=$(gh run list --repo ${{ github.repository }} --workflow build.yml --branch vegas \
            --status success --limit 1 --json headSha,databaseId)
          if [ -z "$RUN_JSON" ] || [ "$RUN_JSON" = "[]" ]; then
            echo "::error::No successful build.yml runs found on branch vegas."
            echo "::error::Trigger a Build DXVK (x64 + x32) workflow first."
            exit 1
          fi
          FULL_SHA=$(echo "$RUN_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['headSha'])")
          RUN_ID=$(echo "$RUN_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['databaseId'])")
          echo "full_sha=$FULL_SHA" >> "$GITHUB_OUTPUT"
          echo "sha=${FULL_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download build DLLs
        uses: actions/download-artifact@v4
        with:
          name: dxvk-${{ steps.get-sha.outputs.full_sha }}
          path: ./workdir
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.get-sha.outputs.run_id }}

      - name: Restructure for WCP
        run: |
          cd ./workdir
          VDIR="$(ls -d dxvk-*/)"
          mv "$VDIR/x64" ./
          mv "$VDIR/x32" ./
          rm -rf "$VDIR"

      - name: Prepare DLL directories
        run: |
          cd ./workdir
          mv x64 system32
          mv x32 syswow64

      - name: Package WCP (DXVK type — stock Winlator)
        run: |
          cd ./workdir
          cat > profile.json << 'JSONEOF'
          {
            "type": "DXVK",
            "versionName": "2.7.3-vegas",
            "versionCode": 1,
            "description": "VEGAS — Community DXVK fork optimized for Android/Winlator",
            "files": [
              {"source": "system32/d3d9.dll",      "target": "${system32}/d3d9.dll"},
              {"source": "system32/d3d10core.dll", "target": "${system32}/d3d10core.dll"},
              {"source": "system32/d3d11.dll",     "target": "${system32}/d3d11.dll"},
              {"source": "system32/dxgi.dll",      "target": "${system32}/dxgi.dll"},
              {"source": "syswow64/d3d8.dll",      "target": "${syswow64}/d3d8.dll"},
              {"source": "syswow64/d3d9.dll",      "target": "${syswow64}/d3d9.dll"},
              {"source": "syswow64/d3d10core.dll", "target": "${syswow64}/d3d10core.dll"},
              {"source": "syswow64/d3d11.dll",     "target": "${syswow64}/d3d11.dll"},
              {"source": "syswow64/dxgi.dll",      "target": "${syswow64}/dxgi.dll"}
            ]
          }
          JSONEOF
          tar --zstd -cf "../dxvk-2.7.3-vegas-${{ steps.get-sha.outputs.sha }}.wcp" \
            system32/ syswow64/ profile.json

      - name: Package WCP (VEGAS type — Star Emulator)
        run: |
          cd ./workdir
          cat > profile.json << 'JSONEOF'
          {
            "type": "VEGAS",
            "versionName": "vegas-2.7.3",
            "versionCode": 1,
            "description": "VEGAS — community DXVK fork optimized for Adreno GPUs",
            "files": [
              {"source": "system32/d3d9.dll",      "target": "${system32}/d3d9.dll"},
              {"source": "system32/d3d10core.dll", "target": "${system32}/d3d10core.dll"},
              {"source": "system32/d3d11.dll",     "target": "${system32}/d3d11.dll"},
              {"source": "system32/dxgi.dll",      "target": "${system32}/dxgi.dll"},
              {"source": "syswow64/d3d8.dll",      "target": "${syswow64}/d3d8.dll"},
              {"source": "syswow64/d3d9.dll",      "target": "${syswow64}/d3d9.dll"},
              {"source": "syswow64/d3d10core.dll", "target": "${syswow64}/d3d10core.dll"},
              {"source": "syswow64/d3d11.dll",     "target": "${syswow64}/d3d11.dll"},
              {"source": "syswow64/dxgi.dll",      "target": "${syswow64}/dxgi.dll"}
            ]
          }
          JSONEOF
          tar --zstd -cf "../vegas-2.7.3-${{ steps.get-sha.outputs.sha }}.wcp" \
            system32/ syswow64/ profile.json

      - name: Upload WCP (DXVK type — stock Winlator)
        uses: actions/upload-artifact@v4
        with:
          name: wcp-dxvk-${{ steps.get-sha.outputs.sha }}
          path: ./dxvk-*.wcp

      - name: Upload WCP (VEGAS type — Star Emulator)
        uses: actions/upload-artifact@v4
        with:
          name: wcp-vegas-${{ steps.get-sha.outputs.sha }}
          path: ./vegas-*.wcp

      - name: Upload vegas config
        uses: actions/upload-artifact@v4
        with:
          name: vegas-config-${{ steps.get-sha.outputs.sha }}
          path: vegas/
