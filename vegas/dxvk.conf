# ============================================================================
# VEGAS — DXVK Configuration for Adreno Android Emulation
# ============================================================================
# Star Emulator / Winlator — Optimized for Qualcomm Adreno GPUs
#
# Place this file in:
#   /storage/emulated/0/Winlator/          (Winlator)
#   /storage/emulated/0/Download/          (alternative)
#   /storage/emulated/0/                   (fallback)
#
# Or set the environment variable:
#   DXVK_CONFIG_FILE=/path/to/dxvk.conf
# ============================================================================

# ============================================================================
# ★★★  MASTER SWITCH  ★★★
# ============================================================================
# Controls ALL Vegas Adreno optimization features as a group.
#
#   Auto  → Enable on Adreno GPUs, disable on all others   (default ★)
#   True  → Force-enable all features (for testing)
#   False → Force-disable all features (emergency escape hatch)
#
# dxvk.enableStarProfile = Auto


# ============================================================================
# ★  VEGAS HUD OVERLAY
# ============================================================================
# Standalone dynamic overlay (independent of DXVK_HUD).
# Shows tier, GPU load, frame time, performance state, active features,
# and numeric frame-time history at the top-right of the screen.
#
#   Auto  → Enabled on Adreno when StarProfile is active   (default ★)
#   True  → Force-enable HUD
#   False → Disable HUD entirely
#
# vegas.enableHud = Auto


# ============================================================================
# ★  FSR 1.0 SPATIAL UPSCALER
# ============================================================================
# FSR 1.0 EASU compute upscaler. Renders at lower resolution and upscales
# to swapchain output. Best on Tier 2-3 Adreno GPUs.
# Set game to 720p (or 540p) internal resolution for best results.
#
#   Auto  → Upscale when render < swapchain resolution   (default ★)
#   True  → Always upscale (render in half-resolution quadrants)
#   False → Disable FSR upscaling entirely
#
# vegas.enableUpscaler = Auto


# ============================================================================
# ★  GPU TIER OVERRIDE  (Advanced)
# ============================================================================
# Override the auto-detected Adreno performance tier.
# Useful if your GPU is misclassified by the KGSL device-name parser.
#
#   0  → Auto-detect based on GPU model              (default ★)
#   1  → Force low-end   (GTX 1050 Ti persona)
#   2  → Force mid-range (GTX 1070 persona)
#   3  → Force high-end  (RTX 3060 persona)
#
# vegas.forceTier = 0


# ============================================================================
# ★  COMPILER THREADS  (Advanced)
# ============================================================================
# Number of shader compiler threads.
# On ARM64, auto-detect caps at 4 to prevent CPU contention on big.LITTLE.
#
#   0  → Auto (max 4 on ARM64, all cores on desktop)   (default ★)
#   N  → Use exactly N compiler threads
#
# dxvk.numCompilerThreads = 0


# ============================================================================
# ★  V-SYNC / SYNC INTERVAL
# ============================================================================
# Override synchronization interval for presentation.
#
#   -1  → Application default (no override)            (default ★)
#    0  → Disable V-Sync (may cause tearing)
#    1  → Enable V-Sync (60 FPS cap)
#
# dxgi.syncInterval = -1


# ============================================================================
# ★  FRAME RATE LIMITER
# ============================================================================
# Limits the frame rate. Helpful for games with physics tied to frame rate,
# or to reduce heat on sustained workloads.
#
#    0  → Default (no limit)                           (default ★)
#   N   → Limit to N frames per second
#  -N   → Soft limit: engage only when running >N FPS
#   -1  → Always disable limiter
#
# dxgi.maxFrameRate = 0


# ============================================================================
# ★  HUD (DXVK Built-in)
# ============================================================================
# Built-in DXVK HUD elements. Comma-separated list.
# Note: VEGAS has its own HUD at the top-right (vegas.enableHud).
#
# Common values:
#   devinfo,fps        → GPU info + frame rate
#   frametimes,gpuload → Frame time graph + GPU load
#   full               → All HUD elements
#
# dxvk.hud =


# ============================================================================
# ★  LOG LEVEL
# ============================================================================
# Controls DXVK log verbosity.
#
#   none   → Suppress all logging
#   error  → Errors only
#   warn   → Warnings + errors                         (default ★)
#   info   → Informational + warnings + errors
#   debug  → Verbose (includes Vegas per-frame metrics)
#
# DXVK_LOG_LEVEL=warn


# ============================================================================
# ★  LATENCY CONTROL
# ============================================================================
# Built-in latency reduction. May reduce input lag in GPU-bound games.
# Can cause frame pacing issues in some titles.
#
#   Auto  → Enable when NV_low_latency2 is available   (default ★)
#   True  → Force-enable latency sleep
#   False → Disable entirely
#
# dxvk.latencySleep = Auto


# ============================================================================
# ★  DEVICE FILTER
# ============================================================================
# Only exposes Vulkan devices whose name contains this string.
# Use if multiple GPUs are present.
#
# DXVK_FILTER_DEVICE_NAME="Adreno"


# ============================================================================
# ★  VRAM LIMITS  (Advanced)
# ============================================================================
# Override reported VRAM. VEGAS auto-tunes to 40% of system RAM.
# Only set these if you need to force a specific value.
#
# dxgi.maxDeviceMemory = 2048
# dxgi.maxSharedMemory  = 1024


# ============================================================================
# ★  PERFORMANCE TWEAKS  (Advanced — use with caution)
# ============================================================================

# Anisotropic filtering override. 0=disable, 1-16=force, -1=application default.
# d3d11.samplerAnisotropy = -1
# d3d9.samplerAnisotropy  = -1

# Tear-free control. True=mailbox (no tearing), False=relaxed fifo.
# dxvk.tearFree = Auto

# Async pipeline compilation. May reduce stutter at the cost of draw calls.
# dxvk.enableAsync = False
